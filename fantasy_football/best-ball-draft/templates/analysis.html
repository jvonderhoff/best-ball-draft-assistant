<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Best Ball — Player Analysis</title>
  <script src="{{ asset('theme.js') }}"></script>
  <link rel="stylesheet" href="{{ asset('theme.css') }}">
  <style>
    :root {
      --bg:      #0f1419; --surface: #1a2535;
      --panel:   #111e2e; --card:    #111827; --hover:  #151f2e;
      --green:   #4caf50; --amber:   #ffc107;
      --elite:   #ffd700; --strong:  #4caf50; --solid:  #4fc3f7;
      --spec:    #ff9800; --flier:   #78909c; --selected: #0d1f33;
    }

    /* ── Page layout ── */
    .page { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }
    .page-header { margin-bottom: 8px; }
    .page-header .page-title { margin-bottom: 4px; }
    .page-title { font-size: 1.3em; font-weight: 700; color: var(--accent); }
    .page-sub { font-size: 0.8em; color: var(--muted); margin-top: 3px; }

    /* ── Controls ── */
    .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .search-box {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      border-radius: 6px; padding: 6px 12px; font-size: 0.85em; width: 200px;
      outline: none;
    }
    .search-box:focus { border-color: var(--accent); }
    .btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      border-radius: 6px; padding: 6px 14px; font-size: 0.82em; font-weight: 600;
      cursor: pointer; transition: all 0.15s;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn-refresh { border-color: #1565c0; color: var(--accent); }
    .btn-refresh:hover { background: #1565c0; color: #fff; }
    .btn-refresh:disabled { opacity: 0.5; cursor: wait; }

    /* ── Position tabs ── */
    .pos-tabs { display: flex; gap: 6px; margin-bottom: 16px; }
    .pos-tab {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      border-radius: 20px; padding: 4px 14px; font-size: 0.8em; font-weight: 700;
      cursor: pointer; transition: all 0.15s;
    }
    .pos-tab:hover { color: var(--text); border-color: #4a6080; }
    .pos-tab.active { border-color: var(--accent); color: var(--accent); background: var(--selected); }

    /* ── Stats bar ── */
    .stats-bar { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
    .stat-chip {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 6px; padding: 6px 14px; font-size: 0.8em;
    }
    .stat-chip strong { color: var(--accent); }

    /* ── Table ── */
    /* Collapsible column groups. Chips rather than a menu so the current shape of
       the table is readable without opening anything. */
    .col-groups { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }
    .col-group {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      border-radius: 6px; padding: 4px 10px; font-size: 0.78em; cursor: pointer;
      font-family: inherit; display: inline-flex; align-items: center; gap: 5px;
    }
    .col-group:hover { color: var(--text); border-color: #4a6080; }
    .col-group.active { border-color: var(--accent); color: var(--accent); background: var(--selected); }
    .col-group.locked { cursor: default; opacity: 0.65; }
    .cg-n { font-size: 0.85em; opacity: 0.6; }

    .table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); }
    /* Freeze rank + player name columns when scrolling horizontally */
    th.sticky, td.sticky {
      position: sticky;
      background: var(--card);
      z-index: 2;
    }
    thead th.sticky { background: var(--panel); z-index: 3; }
    th.sticky-rank,  td.sticky-rank  { left: 0;    min-width: 36px; }
    th.sticky-name,  td.sticky-name  { left: 36px; min-width: 160px; border-right: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: 0.82em; }
    thead { background: var(--panel); position: sticky; top: 0; z-index: 1; }
    th {
      padding: 10px 10px; text-align: left; color: var(--muted); font-weight: 700;
      font-size: 0.78em; letter-spacing: 0.04em; border-bottom: 1px solid var(--border);
      cursor: pointer; white-space: nowrap; user-select: none;
    }
    th:hover { color: var(--text); }
    th.sorted { color: var(--accent); }
    th .sort-arrow { margin-left: 3px; font-size: 0.8em; }
    td { padding: 8px 10px; border-bottom: 1px solid var(--surface); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--hover); }

    /* ── Tier badge ── */
    .tier {
      display: inline-block; padding: 2px 7px; border-radius: 10px;
      font-size: 0.72em; font-weight: 700; letter-spacing: 0.04em; white-space: nowrap;
    }
    .tier-Elite   { background: #3d3000; color: var(--elite);  border: 1px solid #7a6000; }
    .tier-Strong  { background: #1b3a1b; color: var(--strong); border: 1px solid #2e6b2e; }
    .tier-Solid   { background: #0d2638; color: var(--solid);  border: 1px solid #1a5070; }
    .tier-Speculative { background: #3d2200; color: var(--spec); border: 1px solid #7a4400; }
    .tier-Flier   { background: #1e2a33; color: var(--flier); border: 1px solid #354555; }

    /* ── Pos badge ── */
    .pos { font-size: 0.7em; font-weight: 700; padding: 1px 5px; border-radius: 3px; }
    .pos-QB { background: #880e4f; color: #f48fb1; }
    .pos-RB { background: #0d47a1; color: #90caf9; }
    .pos-WR { background: #1b5e20; color: #a5d6a7; }
    .pos-TE { background: #e65100; color: #ffcc80; }

    /* ── Score bars ── */
    .score-bar-wrap { display: flex; align-items: center; gap: 6px; }
    .score-bar { height: 4px; border-radius: 2px; flex-shrink: 0; }
    .score-val { font-weight: 600; color: var(--text); min-width: 34px; }
    .composite-val { font-weight: 700; font-size: 1.05em; color: var(--accent); }

    /* ── Delta ── */
    .delta { font-weight: 700; font-size: 0.9em; }
    .delta-pos { color: var(--green); }   /* undervalued */
    .delta-neg { color: var(--red); }     /* overvalued */
    .delta-zero { color: var(--muted); }

    /* ── Loading/empty ── */
    .loading, .error-msg, .empty-msg {
      text-align: center; padding: 60px 20px; color: var(--muted); font-size: 0.9em;
    }
    .error-msg { color: var(--red); }
    .spinner {
      width: 32px; height: 32px; border: 3px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.7s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Sleeper link indicator ── */
    .no-data { color: var(--no-data); font-style: italic; font-size: 0.85em; }

    /* ── Mobile ── */
    @media (max-width: 600px) {
      nav { padding: 0 12px; gap: 14px; height: 44px; }
      nav a { font-size: 0.8em; }
      .page { padding: 12px 10px; }
      .page-title { font-size: 1.1em; }
      .controls { width: 100%; }
      .search-box { width: 100%; }
      .btn { font-size: 0.8em; padding: 6px 10px; }
      .pos-tabs { flex-wrap: wrap; gap: 4px; }
      .pos-tab { padding: 4px 10px; font-size: 0.75em; }
      .stats-bar { gap: 8px; }
      .stat-chip { padding: 5px 10px; font-size: 0.75em; }
      /* Freeze only rank on mobile — name too wide to also freeze */
      th.sticky-name, td.sticky-name { min-width: 120px; }
    }
  </style>
</head>
<body>

<nav>
  <a href="/recommend">Live Draft</a>
  <a href="/history">History</a>
  <a href="/rankings">Rankings</a>
  <a href="/analysis" class="active">Analysis</a>
  <a href="/setup">Setup</a>
  <button class="theme-toggle" onclick="toggleTheme()"><!-- label via CSS ::after --></button>
</nav>

<div class="page">
  <div class="page-header">
    <div class="page-title">Player Analysis</div>
    <div class="page-sub">SL = Sleeper · FP = FantasyPros</div>
  </div>

  <div class="controls">
    <input class="search-box" id="search" type="text" placeholder="Search player or team…">
    <button class="btn btn-refresh" id="refresh-btn" onclick="loadData(true)">↻ Refresh Stats</button>
    <button class="btn" id="dk-btn" onclick="fetchProps('dk')" style="border-color:#7b1fa2;color:#ce93d8" title="Scrape DK Sportsbook season prop lines (takes ~30s)">📊 Fetch DK Lines</button>
    <button class="btn" id="ud-btn" onclick="fetchProps('ud')" style="border-color:#1565c0;color:#90caf9" title="Fetch Underdog Fantasy season prop lines">🐶 Fetch Underdog Lines</button>
  </div>
  <div class="pos-tabs" id="pos-tabs">
    <button class="pos-tab active" data-pos="">All</button>
    <button class="pos-tab" data-pos="QB">QB</button>
    <button class="pos-tab" data-pos="RB">RB</button>
    <button class="pos-tab" data-pos="WR">WR</button>
    <button class="pos-tab" data-pos="TE">TE</button>
  </div>
  <div class="col-groups" id="col-groups"></div>
  <div class="table-wrap">
      <div class="loading" id="loading">
        <div class="spinner"></div>
        Fetching 2025 Sleeper stats…
      </div>
      <div class="error-msg" id="error-msg" style="display:none"></div>
      <table id="analysis-table" style="display:none">
      <thead>
        <tr id="thead-row"></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty-msg" id="empty-msg" style="display:none">No players match your filter.</div>
  </div>
</div>

<script>
let allPlayers = [];
let sortCol = 'adp';
let sortDir = 1;   // 1 = asc, -1 = desc
let activePos = '';
let searchQ = '';

// ── Column model ──────────────────────────────────────────────────────────────
//
// ONE definition per column, driving BOTH the header and the body. The table used
// to hand-maintain a <th> list and a parallel <td> template literal, which meant
// every insertion had to be made twice in the right position — the same class of
// hand-maintained parallel structure that the asset() cache-buster exists to
// avoid. At 50+ columns across 8 groups that drift is a certainty, not a risk.
//
// key    sort key on the player object (also the localStorage/DOM id)
// group  which collapsible block it belongs to
// label  header text; title = tooltip
// asc    true if a LOW value is good, so first click sorts ascending
// render (p) -> innerHTML of the cell

function propLine(val) {
  if (val == null) return '<span class="no-data">—</span>';
  return val % 1 === 0 ? val : val.toFixed(1);
}

function deltaCell(val) {
  if (val == null) return '<span class="delta delta-zero">—</span>';
  if (val > 0)     return `<span class="delta delta-pos">+${val}</span>`;
  if (val < 0)     return `<span class="delta delta-neg">${val}</span>`;
  return '<span class="delta delta-zero">0</span>';
}

const NO = '<span class="no-data">—</span>';
const num = (v, dp) => (v == null ? NO : (dp == null ? v : Number(v).toFixed(dp)));

// Signed value where POSITIVE is the good/buy direction.
function signed(v, dp, invert) {
  if (v == null) return NO;
  const good = invert ? v < 0 : v > 0;
  const cls = v === 0 ? 'delta-zero' : good ? 'delta-pos' : 'delta-neg';
  const s = Number(v).toFixed(dp == null ? 0 : dp);
  return `<span class="delta ${cls}">${v > 0 ? '+' : ''}${s}</span>`;
}

const GROUPS = [
  { id: 'core',    label: 'Core',        locked: true  },
  { id: 'proj',    label: 'Projections', open: true    },
  { id: 'opp',     label: 'Opportunity', open: true    },
  { id: 'rz',      label: 'Red zone',    open: false   },
  { id: 'ctx',     label: 'Context',     open: false   },
  { id: 'score',   label: 'Scores',      open: false   },
  { id: 'dk',      label: 'DK props',    open: false   },
  { id: 'ud',      label: 'UD props',    open: false   },
];

const COLUMNS = [
  // ── Core ──────────────────────────────────────────────────────────────────
  { key: 'custom_rank', group: 'core', label: 'My Rank', asc: true,
    title: 'Your personal rank from the Rankings page',
    cls: 'sticky sticky-rank',
    render: p => `<span style="color:${p.custom_rank ? 'var(--accent)' : 'var(--muted)'};font-weight:${p.custom_rank ? '700' : '400'}">${p.custom_rank ?? '—'}</span>` },
  { key: 'name', group: 'core', label: 'Player', asc: true, cls: 'sticky sticky-name',
    render: p => `<span style="font-weight:600;color:var(--text)">${p.name}</span>`
               + `<span style="color:var(--muted);font-size:0.82em;margin-left:5px">${p.team}</span>` },
  { key: 'pos',  group: 'core', label: 'Pos', asc: true,
    render: p => `<span class="pos pos-${p.pos}">${p.pos}</span>` },
  { key: 'tier', group: 'core', label: 'Tier',
    render: p => `<span class="tier tier-${p.tier.replace(' ','')}">${p.tier}</span>` },
  { key: 'adp',  group: 'core', label: 'DK ADP', asc: true,
    render: p => `<span style="color:var(--muted)">${p.adp ?? '—'}</span>` },

  // ── Projections ───────────────────────────────────────────────────────────
  { key: 'consensus_rank', group: 'proj', label: 'Consensus', asc: true,
    title: 'Positional consensus rank from FP + Sleeper (QB1, RB7, WR12…)',
    render: p => p.consensus_label ? `<span style="color:var(--text);font-weight:700">${p.consensus_label}</span>` : NO },
  { key: 'consensus_ppr', group: 'proj', label: 'Avg PPR',
    title: 'Average of the available PPR point sources',
    render: p => p.consensus_ppr > 0 ? `<span style="color:var(--accent);font-weight:700">${p.consensus_ppr}</span>` : NO },
  { key: 'proj_pts_ppr', group: 'proj', label: 'SL PPR', title: 'Sleeper 2026 projected full-PPR season points',
    render: p => p.proj_pts_ppr > 0 ? `<strong style="color:#b0bec5">${p.proj_pts_ppr}</strong>` : NO },
  { key: 'fp_pts_ppr', group: 'proj', label: 'FP PPR', title: 'FantasyPros 2026 PPR consensus season projection',
    render: p => p.fp_pts_ppr > 0 ? `<strong style="color:var(--green)">${p.fp_pts_ppr}</strong>` : NO },
  { key: 'yahoo_pts_ppr', group: 'proj', label: 'YH PPR', title: 'Yahoo Fantasy 2026 projected PPR season points',
    render: p => p.yahoo_pts_ppr > 0 ? `<strong style="color:#7986cb">${p.yahoo_pts_ppr}</strong>`
              : p.yahoo_rank ? `<span style="color:#9fa8da;font-size:0.85em">${p.pos}${p.yahoo_rank}</span>` : NO },
  { key: 'pts_ppr', group: 'proj', label: '2025 PPR', title: '2025 actual full-PPR points',
    render: p => p.pts_ppr > 0 ? `<strong>${p.pts_ppr}</strong>` : NO },
  { key: 'gp', group: 'proj', label: 'GP', title: '2025 games played',
    render: p => p.pts_ppr > 0 ? p.gp : NO },
  { key: 'trajectory', group: 'proj', label: 'Traj',
    title: '% change from 2025 actual PPR to 2026 consensus projection. NEW = rookie or no 2025 data.',
    render: p => {
      if (p.trajectory == null) return p.consensus_ppr > 0 ? '<span style="color:var(--muted);font-size:0.8em">NEW</span>' : NO;
      const up = p.trajectory >= 0;
      return `<span style="color:${up ? 'var(--green)' : 'var(--red)'};font-weight:600">${up ? '↑' : '↓'} ${Math.abs(p.trajectory)}%</span>`;
    } },
  { key: 'pos_z', group: 'proj', label: 'Pos Z',
    title: 'FP PPR points normalised within position (z-score). +2 = top of position, -1 = below average.',
    render: p => p.pos_z != null
      ? `<span style="color:${p.pos_z >= 1 ? 'var(--green)' : p.pos_z <= -1 ? 'var(--red)' : 'var(--text)'};font-weight:600">${p.pos_z > 0 ? '+' : ''}${p.pos_z}</span>` : NO },
  { key: 'upside', group: 'proj', label: 'Upside',
    title: 'Best-ball upside score (0–100): position volatility 40% + source disagreement 30% + trajectory 30%.',
    render: p => `<span style="color:var(--accent);font-weight:600">${p.upside}</span>` },
  { key: 'proj_rec_yd',  group: 'proj', label: 'SL RecYd', title: 'Sleeper 2026 projected receiving yards',
    render: p => p.proj_pts_ppr > 0 && p.proj_rec_yd ? p.proj_rec_yd.toLocaleString() : NO },
  { key: 'proj_rush_yd', group: 'proj', label: 'SL RuYd', title: 'Sleeper 2026 projected rushing yards',
    render: p => p.proj_pts_ppr > 0 && p.proj_rush_yd ? p.proj_rush_yd.toLocaleString() : NO },
  { key: 'proj_pass_yd', group: 'proj', label: 'SL PaYd', title: 'Sleeper 2026 projected passing yards',
    render: p => p.proj_pts_ppr > 0 && p.proj_pass_yd ? p.proj_pass_yd.toLocaleString() : NO },

  // ── Opportunity (2025 actuals) ────────────────────────────────────────────
  { key: 'tgt', group: 'opp', label: 'Tgt', title: '2025 targets. The raw count behind the share.',
    render: p => num(p.tgt) },
  { key: 'tgt_share', group: 'opp', label: 'Tgt%',
    title: 'Share of his own team’s 2025 targets. The most persistent opportunity signal available — volume carries year to year far better than efficiency. Needs 10+ targets; pass catchers only.',
    render: p => p.tgt_share == null ? NO
      : `<span style="color:${p.tgt_share >= 25 ? 'var(--green)' : p.tgt_share >= 15 ? 'var(--text)' : 'var(--muted)'};font-weight:600">${p.tgt_share}%</span>` },
  { key: 'ay_per_rec', group: 'opp', label: 'AY/Rec',
    title: 'Completed air yards per reception — how far downfield his catches happen. NOT aDOT: Sleeper reports completed air yards (receiving yards minus YAC), not intended, so true aDOT is not computable from this source. Negative means he catches behind the line.',
    render: p => p.ay_per_rec == null ? NO
      : `<span style="color:${p.ay_per_rec < 0 ? 'var(--muted)' : 'var(--text)'}">${p.ay_per_rec}</span>` },
  { key: 'catch_rate', group: 'opp', label: 'Catch%', title: 'Receptions / targets, 2025. Needs 10+ targets.',
    render: p => p.catch_rate == null ? NO : `${p.catch_rate}%` },

  // ── Red zone / TD regression ──────────────────────────────────────────────
  { key: 'rz_tgt', group: 'rz', label: 'RZ Tgt', title: '2025 red-zone targets', render: p => num(p.rz_tgt) },
  { key: 'rz_att', group: 'rz', label: 'RZ Att', title: '2025 red-zone carries', render: p => num(p.rz_att) },
  { key: 'xtd', group: 'rz', label: 'xTD',
    title: 'Expected TDs from red-zone usage, priced at the league-wide TD rate per red-zone target and per red-zone carry (measured from this season, not hardcoded).',
    render: p => num(p.xtd, 1) },
  { key: 'td_delta', group: 'rz', label: 'ΔTD',
    title: 'Actual TDs minus expected. POSITIVE = outscored his usage, a regression-down candidate (sell). NEGATIVE = the usage was there and the touchdowns were not (buy). A statement about last season’s luck, not a forecast.',
    render: p => signed(p.td_delta, 1, true) },

  // ── Context ───────────────────────────────────────────────────────────────
  { key: 'age', group: 'ctx', label: 'Age', asc: true, title: 'Age per Sleeper',
    render: p => num(p.age) },
  { key: 'years_exp', group: 'ctx', label: 'Exp', asc: true, title: 'NFL seasons of experience. 0 = rookie.',
    render: p => p.years_exp == null ? NO : (p.years_exp === 0 ? '<span style="color:var(--accent);font-weight:600">R</span>' : p.years_exp) },
  { key: 'depth_order', group: 'ctx', label: 'Depth', asc: true, title: 'Depth-chart order at his position per Sleeper. 1 = starter.',
    render: p => num(p.depth_order) },
  { key: 'bye', group: 'ctx', label: 'Bye', asc: true, title: '2026 bye week',
    render: p => num(p.bye) },
  { key: 'injury', group: 'ctx', label: 'Status', asc: true, title: 'Sleeper injury designation; blank means no designation.',
    render: p => p.injury ? `<span style="color:var(--red);font-size:0.85em">${p.injury}</span>` : NO },

  // ── Scores (already computed server-side) ─────────────────────────────────
  { key: 'value_delta', group: 'score', label: 'Value Δ',
    title: 'DK ADP minus our consensus-based rank. POSITIVE = the market is drafting him later than the consensus says (value).',
    render: p => signed(p.value_delta) },
  { key: 'composite', group: 'score', label: 'Comp',
    title: 'Composite: projection 45% + ADP 30% + durability 15% + playoff schedule 10%. Drives the Tier badge.',
    render: p => num(p.composite, 1) },
  { key: 'durability', group: 'score', label: 'Dur', title: '2025 games played as a share of 17.',
    render: p => num(p.durability, 0) },
  { key: 'schedule_score', group: 'score', label: 'Sched',
    title: 'Share of weeks 15–17 with a game scheduled. NOTE: this only checks a game EXISTS (it is a bye detector); it does not weigh opponent strength.',
    render: p => num(p.schedule_score, 0) },
];

// DK / UD prop columns are mechanical repeats, so they are generated rather than
// typed out twice — the two books expose an identical market shape.
for (const [book, label] of [['dk', 'DK'], ['ud', 'UD']]) {
  COLUMNS.push({ key: `${book}_prop_ppr`, group: book, label: `${label} PPR`,
    title: `Full-PPR points implied by ${label} prop lines`,
    render: p => p[`${book}_prop_ppr`] != null
      ? `<strong style="color:${book === 'dk' ? '#ce93d8' : '#90caf9'}">${p[`${book}_prop_ppr`]}</strong>` : NO });
  COLUMNS.push({ key: `${book}_prop_adp_delta`, group: book, label: `${label} Δ`,
    title: `DK ADP vs ${label} prop-implied rank. + = market too low (buy)`,
    render: p => deltaCell(p[`${book}_prop_adp_delta`]) });
  for (const [k, lbl] of [['rush_yd','RuYd'],['rec_yd','RecYd'],['rec','Rec'],
                          ['rush_td','RuTD'],['rec_td','RecTD'],['pass_yd','PaYd'],['pass_td','PaTD']]) {
    COLUMNS.push({ key: `${book}_${k}`, group: book, label: `${label} ${lbl}`,
      title: `${label} season ${lbl} O/U`, render: p => propLine(p[`${book}_${k}`]) });
  }
}

// ── Group visibility ──────────────────────────────────────────────────────────

const GROUP_KEY = 'bb-analysis-groups';
let openGroups = (() => {
  try {
    const saved = JSON.parse(localStorage.getItem(GROUP_KEY));
    if (saved && typeof saved === 'object') return saved;
  } catch (e) { /* corrupt or absent — fall through to defaults */ }
  return Object.fromEntries(GROUPS.map(g => [g.id, !!g.open]));
})();

function isOpen(gid) {
  const g = GROUPS.find(x => x.id === gid);
  return g && (g.locked || openGroups[gid]);
}

function visibleColumns() {
  return COLUMNS.filter(c => isOpen(c.group));
}

function renderGroupBar() {
  document.getElementById('col-groups').innerHTML = GROUPS.map(g => {
    const n = COLUMNS.filter(c => c.group === g.id).length;
    if (g.locked) return `<span class="col-group locked">${g.label} <span class="cg-n">${n}</span></span>`;
    return `<button class="col-group${openGroups[g.id] ? ' active' : ''}" data-group="${g.id}">`
         + `${openGroups[g.id] ? '▾' : '▸'} ${g.label} <span class="cg-n">${n}</span></button>`;
  }).join('');
  document.querySelectorAll('#col-groups .col-group[data-group]').forEach(btn => {
    btn.addEventListener('click', () => {
      const gid = btn.dataset.group;
      openGroups[gid] = !openGroups[gid];
      localStorage.setItem(GROUP_KEY, JSON.stringify(openGroups));
      // Sorting by a column that just went away would leave the table ordered by
      // something invisible, which reads as a bug. Fall back to ADP.
      if (!visibleColumns().some(c => c.key === sortCol)) { sortCol = 'adp'; sortDir = 1; }
      renderGroupBar();
      renderHead();
      renderTable();
    });
  });
}

function renderHead() {
  document.getElementById('thead-row').innerHTML = visibleColumns().map(c => {
    const sorted = c.key === sortCol;
    return `<th data-col="${c.key}" class="${c.cls || ''}${sorted ? ' sorted' : ''}"`
         + `${c.title ? ` title="${c.title.replace(/"/g, '&quot;')}"` : ''}>`
         + `${c.label} <span class="sort-arrow">${sorted ? (sortDir === 1 ? '▼' : '▲') : ''}</span></th>`;
  }).join('');
  document.querySelectorAll('#thead-row th[data-col]').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      if (sortCol === col) sortDir *= -1;
      else { sortCol = col; sortDir = (COLUMNS.find(c => c.key === col) || {}).asc ? 1 : -1; }
      renderHead();
      renderTable();
    });
  });
}

// ── Fetch betting lines ───────────────────────────────────────────────────────

async function fetchProps(book) {
  const isDK = book === 'dk';
  const btn  = document.getElementById(isDK ? 'dk-btn' : 'ud-btn');
  const url  = isDK ? '/api/props/refresh' : '/api/props/refresh/underdog';
  const origText = btn.textContent;
  btn.disabled = true;
  btn.textContent = isDK ? '📊 Scraping DK… (~30s)' : '🐶 Fetching Underdog…';
  try {
    const res  = await fetch(url, { method: 'POST' });
    const json = await res.json();
    if (json.ok) {
      btn.textContent = `${isDK ? '📊' : '🐶'} ${json.players} players loaded`;
      await loadData(false);
    } else {
      btn.textContent = origText;
      alert('Props fetch issue: ' + (json.error || 'unknown'));
    }
  } catch (e) {
    btn.textContent = origText;
    alert('Error: ' + e.message);
  } finally {
    btn.disabled = false;
  }
}

// ── Load data ─────────────────────────────────────────────────────────────────

async function loadData(forceRefresh = false) {
  const btn = document.getElementById('refresh-btn');
  btn.disabled = true;
  btn.textContent = '↻ Loading…';
  document.getElementById('loading').style.display = '';
  document.getElementById('analysis-table').style.display = 'none';
  document.getElementById('error-msg').style.display = 'none';
  document.getElementById('empty-msg').style.display = 'none';

  try {
    const url = '/api/analysis' + (forceRefresh ? '?refresh=1' : '');
    const res = await fetch(url);
    const json = await res.json();
    if (!res.ok || !json.ok) throw new Error(json.error || 'Unknown error');
    allPlayers = json.players;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('analysis-table').style.display = '';
    renderTable();
  } catch (e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error-msg').style.display = '';
    document.getElementById('error-msg').textContent = '⚠ ' + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = '↻ Refresh Stats';
  }
}

// ── Render ────────────────────────────────────────────────────────────────────

function renderTable() {
  let rows = allPlayers.filter(p => {
    if (activePos && p.pos !== activePos) return false;
    if (searchQ) {
      const q = searchQ.toLowerCase();
      if (!p.name.toLowerCase().includes(q) && !p.team.toLowerCase().includes(q)) return false;
    }
    return true;
  });

  // Missing values sort to the BOTTOM in either direction, rather than counting as
  // zero. Half these columns are legitimately null for rookies and quarterbacks,
  // and letting those float to the top of a "best target share" sort would bury
  // the players actually being ranked.
  rows.sort((a, b) => {
    let av = a[sortCol], bv = b[sortCol];
    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;
    if (typeof av === 'string') av = av.toLowerCase();
    if (typeof bv === 'string') bv = bv.toLowerCase();
    return av < bv ? -sortDir : av > bv ? sortDir : 0;
  });

  const tbody = document.getElementById('tbody');
  if (!rows.length) {
    tbody.innerHTML = '';
    document.getElementById('analysis-table').style.display = 'none';
    document.getElementById('empty-msg').style.display = '';
    return;
  }
  document.getElementById('analysis-table').style.display = '';
  document.getElementById('empty-msg').style.display = 'none';

  const cols = visibleColumns();
  tbody.innerHTML = rows.map(p =>
    '<tr>' + cols.map(c => `<td class="${c.cls || ''}">${c.render(p)}</td>`).join('') + '</tr>'
  ).join('');
}

// ── Position tabs (stats view) ────────────────────────────────────────────────

document.querySelectorAll('#pos-tabs .pos-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#pos-tabs .pos-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activePos = btn.dataset.pos;
    renderTable();
  });
});

// ── Search (stats view) ───────────────────────────────────────────────────────

document.getElementById('search').addEventListener('input', e => {
  searchQ = e.target.value.trim();
  renderTable();
});

// ── Init ──────────────────────────────────────────────────────────────────────

renderGroupBar();
renderHead();
loadData();
</script>
</body>
</html>
